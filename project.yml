name: NeutrinoNotes
packages:
  swift-sodium:
    url: https://github.com/jedisct1/swift-sodium
    from: "0.9.1"
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: "0.8.0"
options:
  bundleIdPrefix: com.neutrino
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16"

targets:
  NeutrinoNotes:
    type: application
    platform: iOS
    sources:
      - path: NeutrinoNotes
    dependencies:
      - package: swift-sodium
        product: Sodium
      - package: swift-markdown
        product: Markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neutrino.notes
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "7"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        DEVELOPMENT_TEAM: "46KWJJ63FU"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: NeutrinoNotes/NeutrinoNotes.entitlements
      properties:
        # Universal Links: `https://www.getneutrino.app/open/note/<file id>` opens a note here
        # instead of in Safari. Both host spellings are claimed so a link pasted without the
        # "www." still resolves. Which *paths* reach this app is decided by the
        # apple-app-site-association document served from the domain — see
        # `deploy/apple-app-site-association` in the Drive repository — not by this list.
        com.apple.developer.associated-domains:
          - applinks:www.getneutrino.app
          - applinks:getneutrino.app
    info:
      path: NeutrinoNotes/Info.plist
      properties:
        CFBundleName: Neutrino Notes
        CFBundleDisplayName: Neutrino Notes
        # Without these, xcodegen writes literal "1.0"/"1" into Info.plist and the
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION build settings are ignored.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Neutrino Notes needs camera access to scan QR codes for key import."
        NSFaceIDUsageDescription: "Neutrino Notes uses Face ID to unlock your notes."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Neutrino Notes Key File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.neutrino.notes.keyfile
            UTTypeConformsTo:
              - public.json
            UTTypeDescription: Neutrino Notes Key File
            UTTypeTagSpecification:
              public.filename-extension:
                - json

  NeutrinoNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NeutrinoNotesTests
    dependencies:
      - target: NeutrinoNotes
    settings:
      base:
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal
